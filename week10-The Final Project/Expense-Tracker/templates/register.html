{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
    <div class="form-container">
        <h2>Create New Account</h2>
        <form action="/register" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="confirmation">Confirm Password</label>
                <input type="password" id="confirmation" name="confirmation" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn-primary btn-full">Register</button>
        </form>
        <p class="form-footer">Already have an account? <a href="/login">Login here</a></p>
    </div>
{% endblock %}
